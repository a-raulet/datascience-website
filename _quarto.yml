project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "!test.qmd"
    - "!test.en.qmd"
    - "!test.ja.qmd"
  post-render:
    - python3 netlify/post_render_seo.py
  resources:
    - "assets/**"
    - robots.txt

execute:
  freeze: auto

website:
  title: "Arnaud Raulet | Intelligence Stratégique Japon"
  site-url: https://arnaudraulet.com
  description: "Intelligence stratégique Japon : analyses quantitatives (brevets japonais, pricing, marketing) pour les décisions qui comptent."
  navbar:
    background: "#151C24"
    foreground: "#F4EFE6"
    search: true
    left:
      - text: "Accueil"
        file: index.qmd
      - text: "Services"
        menu:
          - text: "Vue d'ensemble"
            file: services/index.qmd
          - text: "JapanTechRadar"
            file: services/japan-tech-radar.qmd
          - text: "PricingDiag"
            file: services/pricing-diag.qmd
      - text: "Analyses"
        file: blog/index.qmd
      - text: "À propos"
        file: about.qmd
    right:
      - icon: github
        href: https://github.com/a-raulet
      - icon: linkedin
        href: https://linkedin.com/in/arnaud-raulet-13308310/
      - text: "🇫🇷"
        href: "/"
      - text: "🇬🇧"
        href: "/index.en.html"
      - text: "🇯🇵"
        href: "/index.ja.html"


format:
  html:
    theme: [cosmo, custom.scss]
    css: styles.css
    toc: true
    code-fold: true
    html-math-method: katex
    include-in-header:
      - file: _includes/umami.html
      - file: _includes/nav-i18n.html
    include-after-body:
      - file: _includes/tracking-loader.html

babelquarto:
  mainlanguage: 'fr'
  languages: ['en', 'ja']
  languagecodes:
    - name: fr
      text: "🇫🇷 Français"
    - name: en
      text: "🇬🇧 English"
    - name: ja
      text: "🇯🇵 日本語"
  languagelinks: navbar
  language-path: "prefix"

title-en: "Arnaud Raulet | Japan Strategic Intelligence"
title-ja: "ローレ・アルノ | データサイエンス×日本戦略"
description-en: "Japan strategic intelligence: quantitative analysis (Japanese patents, pricing, marketing) for decisions that matter."
description-ja: "データサイエンス×日本戦略：特許・価格・マーケティングの定量分析で、重要な意思決定を支えます。"
author-en: "Arnaud RAULET"
author-ja: "ローレ・アルノ"

lang: fr
